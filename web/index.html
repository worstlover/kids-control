<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7C4DFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>پنل خانواده</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#7C4DFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="پنل خانواده">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1d2330;--m:#6b7385;--p:#4f46e5;--g:#16a34a;--r:#dc2626;--b:#e3e6ee}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--c:#1c1f2a;--t:#eef0f6;--m:#9aa2b5;--b:#2b3040}}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,sans-serif;background:var(--bg);color:var(--t);padding:12px;max-width:640px;margin:auto}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}
button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button.s{background:var(--b);color:var(--t)}button.g{background:var(--g)}button.r{background:var(--r)}
textarea{width:100%;min-height:90px;padding:8px;margin:4px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
input,select{width:100%;padding:8px;margin:4px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>button{flex:0 0 auto}
.tabs{display:flex;gap:4px;overflow-x:auto}.tabs button{background:var(--c);color:var(--t);border:1px solid var(--b)}.tabs button.on{background:var(--p);color:#fff}
.bar{height:8px;background:var(--b);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.m{color:var(--m);font-size:13px}.big{font-size:28px;font-weight:bold}
body{background:linear-gradient(180deg,#EDE7FF,#FFF0F7 60%,#F6F7FB);min-height:100vh;padding-bottom:48px}
.card{box-shadow:0 6px 18px rgba(79,70,229,.08);border-radius:18px;border:0}
button{border-radius:14px;padding:10px 14px;font-weight:600;transition:transform .08s}
button:active{transform:scale(.97)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips button{padding:7px 12px;font-size:14px;border-radius:999px}
input{border-radius:12px}
.tabs{position:sticky;top:0;z-index:5;background:rgba(246,247,251,.92);backdrop-filter:blur(8px);padding:8px 12px;margin:0 -12px}
.tabs button{border-radius:999px}
.bar i{background:linear-gradient(90deg,#7C4DFF,#FF5C93)}
</style>
</head>
<body>
<div id="app"></div>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
<script>
// ===== تنظیمات: مقدار Supabase خودت را اینجا بگذار =====
const SB_URL = 'https://YOUR-PROJECT.supabase.co';
const SB_KEY = 'YOUR-ANON-KEY';
// ========================================================
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fa = n => Number(n).toLocaleString('fa-IR');
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tehran' }).format(new Date());
const sha = async t => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)))].map(b => b.toString(16).padStart(2, '0')).join('');
let st = { kids: [], kid: null, tab: 'today', rate: 1000 };

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data: s } = await sb.from('settings').select('*').single();
  st.rate = s?.toman_per_point ?? 1000;
  const { data: k } = await sb.from('kids').select('*').eq('active', true).order('name');
  st.kids = k || [];
  if (!st.kid || !st.kids.find(x => x.id === st.kid)) st.kid = st.kids[0]?.id || null;
  render();
}

function loginView() {
  $('#app').innerHTML = `<div class="card"><h3>ورود والدین</h3>
  <input id="em" type="email" placeholder="ایمیل" dir="ltr"><input id="pw" type="password" placeholder="رمز" dir="ltr">
  <button onclick="login()">ورود</button></div>`;
}
async function login() {
  const { error } = await sb.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
  error ? alert(error.message) : boot();
}

let rid = 0; // newest render wins (prevents a slow earlier render from overwriting a newer tab)
async function render() {
  const my = ++rid;
  const kid = st.kids.find(k => k.id === st.kid);
  const tabs = [['today','امروز'],['tasks','کارها'],['dict','دیکته'],['learn','یادگیری'],['usage','گزارش'],['points','امتیاز'],['wish','آرزوها'],['apps','برنامه‌ها'],['set','تنظیمات']];
  let h = `<div class="tabs">${st.kids.map(k => `<button class="${k.id===st.kid?'on':''}" onclick="st.kid='${k.id}';render()">${esc(k.name)}</button>`).join('')}
    <button class="s" onclick="addKid()">+ فرزند</button></div>`;
  if (!kid) { $('#app').innerHTML = h + '<div class="card">اول یک فرزند اضافه کن.</div>'; return; }
  h += `<div class="tabs" style="margin-top:8px">${tabs.map(([k,l]) => `<button class="${k===st.tab?'on':''}" onclick="st.tab='${k}';render()">${l}</button>`).join('')}</div>`;
  h += await views[st.tab](kid);
  if (my !== rid) return;
  $('#app').innerHTML = h;
}

const balance = async id => {
  const { data } = await sb.from('points_ledger').select('delta').eq('kid_id', id);
  return (data || []).reduce((a, r) => a + r.delta, 0);
};

// تولید نوبت‌های امروز از قالب کارها
async function ensureToday(kid) {
  const { data: ts } = await sb.from('tasks').select('*').eq('kid_id', kid.id).eq('active', true);
  const wd = new Date(today() + 'T12:00:00Z').getUTCDay();
  const due = (ts || []).filter(t => t.kind === 'daily' || (t.kind === 'weekly' && (t.weekdays || []).includes(wd)));
  if (due.length) await sb.from('task_logs').upsert(due.map(t => ({ task_id: t.id, kid_id: kid.id, due_date: today() })), { onConflict: 'task_id,due_date', ignoreDuplicates: true });
}

const views = {
  // What the kid really learned with the tutor: concepts that passed spaced reviews, weak spots, recent checks.
  async learn(kid) {
    const [{ data: profs }, { data: cs }, { data: ex }] = await Promise.all([
      sb.from('tutor_profiles').select('subject,level,goal').eq('kid_id', kid.id),
      sb.from('tutor_concepts').select('*').eq('kid_id', kid.id).order('updated_at', { ascending: false }).limit(300),
      sb.from('tutor_exercises').select('subject,kind,status,day,prompt,result').eq('kid_id', kid.id).order('created_at', { ascending: false }).limit(60),
    ]);
    if (!(profs || []).length) return '<div class="card">هنوز با معلم کار نکرده.</div>';
    const SUB = { english: 'انگلیسی', math: 'ریاضی', persian: 'فارسی', science: 'علوم' };
    const nm = s => s.startsWith('free:') ? '🎨 کلاس آزاد · ' + esc(s.slice(5)) : '🏫 مدرسه · ' + esc(SUB[s] || s);
    const td = today();
    const order = p => (p.subject.startsWith('free:') ? 1 : 0);
    return `<div class="card m">هر مفهوم وقتی «یاد گرفته» حساب می‌شود که بعد از آزمون خروج، ۳ روز و یک هفته بعد هم درست جواب داده شود؛ اگر سه هفته بعد هم یادش بود «تثبیت شده» است.</div>` +
      profs.slice().sort((a, b) => order(a) - order(b)).map(p => {
        const c = (cs || []).filter(x => x.subject === p.subject);
        const by = st => c.filter(x => x.status === st);
        const due = c.filter(x => x.next_review && x.next_review <= td).length;
        const weak = by('practicing').concat(by('new')).sort((a, b) => (b.hints + b.simpler) - (a.hints + a.simpler)).slice(0, 6);
        const strong = by('solid').concat(by('learned'));
        const recent = (ex || []).filter(e => e.subject === p.subject && (e.status === 'checked' || e.result?.teach)).slice(0, 6);
        const lbl = e => e.prompt?.exit ? '🚪 آزمون خروج' : e.prompt?.review ? '🔁 مرور' : e.kind === 'assessment' ? '📝 تعیین سطح' : e.kind === 'explain' ? '🖍 تخته' : '🎯 تمرین';
        const res = e => e.result?.teach ? `یاد داد: ${fa(e.result.teach.score)}٪` : e.result?.score != null ? `${fa(e.result.score)} از ${fa(e.prompt?.questions?.length || 5)}` + (e.result.photo ? ' (با عکس راه‌حل)' : '') : '';
        return `<div class="card"><b>${nm(p.subject)}</b> <span class="m">· سطح: ${esc(p.level || 'هنوز تعیین نشده')}</span>
          ${p.goal ? `<div class="m">🎯 ${esc(p.goal)}</div>` : ''}
          <div class="row" style="margin-top:8px;text-align:center">
            <div><div class="big">${fa(by('solid').length)}</div><div class="m">⭐ تثبیت</div></div>
            <div><div class="big">${fa(by('learned').length)}</div><div class="m">✅ یاد گرفته</div></div>
            <div><div class="big">${fa(by('practicing').length + by('new').length)}</div><div class="m">🔄 در تمرین</div></div>
            <div><div class="big">${fa(due)}</div><div class="m">⏰ مرور امروز</div></div>
          </div>
          ${weak.length ? `<div style="margin-top:8px"><b>نیاز به کمک</b>${weak.map(x => `<div class="m">• ${esc(x.name)} — بار اول درست ${fa(x.first_try_correct)} از ${fa(x.attempts)}${x.hints + x.simpler ? ` · ${fa(x.hints + x.simpler)} بار کمک` : ''}</div>`).join('')}</div>` : ''}
          ${strong.length ? `<div style="margin-top:8px"><b>یاد گرفته</b><div class="m">${strong.map(x => (x.status === 'solid' ? '⭐ ' : '✅ ') + esc(x.name)).join(' · ')}</div></div>` : ''}
          ${recent.length ? `<div style="margin-top:8px"><b>اخیر</b>${recent.map(e => `<div class="m">${lbl(e)} «${esc(e.prompt?.title || e.prompt?.topic || '')}» · ${esc(e.day)} · ${res(e)}</div>`).join('')}</div>` : ''}
        </div>`;
      }).join('');
  },
  async today(kid) {
    await ensureToday(kid);
    const { data } = await sb.from('task_logs').select('*, tasks(title,points,needs_photo)').eq('kid_id', kid.id).eq('due_date', today());
    const bal = await balance(kid.id);
    const lbl = { pending: 'انجام نشده', submitted: 'منتظر تایید', graded: 'نمره‌دار', approved: 'تایید شد', rejected: 'رد شد' };
    return `<div class="card"><div class="m">موجودی امتیاز</div><div class="big">${fa(bal)}</div><div class="m">≈ ${fa(bal * st.rate)} تومان</div></div>
    ${(data || []).map(l => `<div class="card"><b>${esc(l.tasks.title)}</b> <span class="m">(${fa(l.tasks.points)} امتیاز)</span>
      <div class="m">${lbl[l.status]}${l.ai_score != null ? ` · نمره هوش مصنوعی: ${fa(l.ai_score)}` : ''}${l.ai_feedback ? `<br>${esc(l.ai_feedback)}` : ''}</div>
      ${l.points_awarded != null && l.status !== 'approved' ? `<div class="m">پیشنهاد امتیاز: ${fa(l.points_awarded)}</div>` : ''}
      <div class="row" style="margin-top:6px">${l.photo_path ? `<button class="s" onclick="showPhoto('${l.photo_path}')">عکس</button>` : ''}${l.status !== 'approved' ? `<button class="g" onclick="approve('${l.id}')">تایید و امتیاز</button>` : ''}${l.status !== 'rejected' ? `<button class="r" onclick="reject('${l.id}')">${l.status === 'approved' ? 'لغو امتیاز' : 'رد'}</button>` : ''}</div></div>`).join('') || '<div class="card m">برای امروز کاری تعریف نشده.</div>'}`;
  },
  async tasks(kid) {
    const { data } = await sb.from('tasks').select('*').eq('kid_id', kid.id).eq('active', true);
    const e = st.editTask ? (data || []).find(t => t.id === st.editTask) : null;
    const s = (e && e.schedule) || {};
    const type = e ? (s.type || (e.kind === 'weekly' ? 'weekdays' : e.kind === 'once' ? 'once' : 'daily')) : 'daily';
    const wds = (s.weekdays || (e && e.weekdays) || []).map(String);
    const cur = { title: e?.title || '', points: e?.points ?? 5, penalty: e?.penalty_points ?? 0, time: e?.due_time || '', photo: !!e?.needs_photo,
      start: s.start || '', end: s.end || '', monthDay: s.month_day || 1, every: s.every_n || 2, date: s.date || today() };
    const types = [['daily', 'هر روز'], ['weekdays', 'روزهای هفته'], ['monthly', 'ماهانه'], ['interval', 'هر چند روز'], ['once', 'یک‌بار']];
    const wdNames = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه', 'شنبه'];
    return `<div class="card">
      <b>${e ? '✏️ ویرایش کار' : '➕ کار جدید'}</b>
      <input id="tt" placeholder="عنوان کار، مثلاً تکالیف مدرسه" value="${esc(cur.title)}">
      <div class="m" style="margin-top:8px">هر وقت انجام می‌شود:</div>
      <div class="chips">${types.map(([k, l]) => `<button type="button" class="tt-btn ${k === type ? '' : 's'}" data-k="${k}" onclick="setTaskType('${k}')">${l}</button>`).join('')}</div>
      <input type="hidden" id="tk" value="${type}">
      <div class="tt-sec" id="tw-weekdays" style="display:${type === 'weekdays' ? 'block' : 'none'}">
        <div class="chips">${wdNames.map((n, i) => `<button type="button" class="wd-btn ${wds.includes(String(i)) ? '' : 's'}" data-i="${i}" onclick="toggleWd(${i})">${n}</button>`).join('')}</div>
        <input type="hidden" id="tweek" value="${wds.join(',')}">
      </div>
      <div class="tt-sec" id="tw-monthly" style="display:${type === 'monthly' ? 'block' : 'none'}">روز ماه <input id="tmd" type="number" min="1" max="31" value="${cur.monthDay}"> <span class="m">(اگر ماه روز کمتری داشت، آخرین روز ماه)</span></div>
      <div class="tt-sec" id="tw-interval" style="display:${type === 'interval' ? 'block' : 'none'}">هر <input id="tev" type="number" min="2" value="${cur.every}"> روز یک‌بار</div>
      <div class="tt-sec" id="tw-once" style="display:${type === 'once' ? 'block' : 'none'}">تاریخ: <input id="tdate" type="date" value="${cur.date}"></div>
      <div class="row"><label class="m">از تاریخ<input id="tstart" type="date" value="${cur.start}"></label><label class="m">تا تاریخ (اختیاری)<input id="tend" type="date" value="${cur.end}"></label></div>
      <div class="row"><label class="m">ساعت انجام (اختیاری)<input id="ttime" type="time" value="${cur.time}"></label></div>
      <div class="row"><label class="m">امتیاز پاداش<input id="tp" type="number" min="0" value="${cur.points}"></label><label class="m">جریمه اگر انجام نشد<input id="tpen" type="number" min="0" value="${cur.penalty}"></label></div>
      <label class="m"><input type="checkbox" id="tph" style="width:auto" ${cur.photo ? 'checked' : ''}> نیاز به عکس (نمره‌دهی هوش مصنوعی)</label>
      <div class="row" style="margin-top:8px"><button onclick="saveTask()">${e ? 'ذخیره تغییرها' : 'افزودن کار'}</button>${e ? '<button class="s" onclick="cancelEdit()">انصراف</button>' : ''}</div>
    </div>
    ${(data || []).map(t => `<div class="card">
      <div><b>${esc(t.title)}</b><div class="m">${taskWhen(t)}${t.due_time ? ' · تا ساعت ' + faStr(t.due_time) : ''} · ${fa(t.points)} امتیاز${t.penalty_points ? ' · جریمه ' + fa(t.penalty_points) : ''}</div></div>
      <div class="row" style="margin-top:8px"><button class="s" onclick="editTask('${t.id}')">✏️ ویرایش</button><button class="s" onclick="delTask('${t.id}')">🗑 حذف</button></div>
      ${st.kids.length > 1 ? `<div class="m" style="margin-top:8px">کپی به:</div><div class="chips">${st.kids.filter(k => k.id !== kid.id).map(k => `<button class="s" onclick="copyTask('${t.id}','${k.id}')">📋 ${esc(k.name)}</button>`).join('')}</div>` : ''}
    </div>`).join('') || '<div class="card m">هنوز کاری نیست.</div>'}
    ${st.kids.length > 1 && (data || []).length ? `<div class="card"><b>کپی همه‌ی کارها</b><div class="chips" style="margin-top:6px">${st.kids.filter(k => k.id !== kid.id).map(k => `<button onclick="copyAll('${k.id}')">همه به ${esc(k.name)}</button>`).join('')}</div></div>` : ''}`;
  },
  async points(kid) {
    const { data: prules } = await sb.from('penalty_rules').select('*').eq('kid_id', kid.id).eq('active', true).order('title');
    const { data } = await sb.from('points_ledger').select('*').eq('kid_id', kid.id).order('created_at', { ascending: false }).limit(30);
    const wk = new Date(Date.now() - 7 * 864e5).toISOString();
    const week = (data || []).filter(r => r.created_at > wk && r.delta > 0).reduce((a, r) => a + r.delta, 0);
    const bal = await balance(kid.id);
    // The kid's own spends from the phone (snack / fun / investment with the 20% gift); a parent can undo one.
    const { data: spends } = await sb.from('points_ledger').select('*').eq('kid_id', kid.id).in('reason', ['spend', 'invest_gift']).order('created_at', { ascending: false }).limit(80);
    const giftOf = {}; (spends || []).filter(r => r.reason === 'invest_gift').forEach(r => { giftOf[r.ref_id] = r.delta; });
    const CAT = { snack: '🍫 خوراکی', fun: '🧸 سرگرمی و اسباب‌بازی', invest: '📈 سرمایه‌گذاری' };
    const sp = (spends || []).filter(r => r.reason === 'spend');
    const byCat = {}; sp.forEach(r => { const c = byCat[r.category] || (byCat[r.category] = { pts: 0, toman: 0 }); c.pts += -r.delta; c.toman += r.amount_toman || 0; });
    const spendCard = `<div class="card"><b>💸 خرج‌های بچه</b><div class="m">خرج از گوشی همان لحظه از امتیاز کم می‌شود؛ برای سرمایه‌گذاری ۲۰٪ هدیه‌ی شما خودکار اضافه می‌شود.</div>
      ${Object.keys(byCat).length ? `<div class="row" style="margin-top:8px">${Object.entries(byCat).map(([k, v]) => `<div><div class="m">${CAT[k] || k}</div><b>${fa(v.toman)} تومان</b><div class="m">${fa(v.pts)} امتیاز</div></div>`).join('')}</div>` : ''}
      ${sp.slice(0, 20).map(r => `<div class="row" style="margin-top:8px;border-top:1px solid var(--b);padding-top:8px"><span style="flex:1">${CAT[r.category] || ''} · ${esc(r.note || '')}<div class="m">${new Date(r.created_at).toLocaleString('fa-IR')}${giftOf[r.ref_id] ? ` · هدیه‌ی شما +${fa(giftOf[r.ref_id])}` : ''}</div></span>
        <span><b>${fa(r.amount_toman || 0)}</b> <span class="m">تومان</span><div class="m" style="text-align:left">−${fa(-r.delta)} امتیاز</div></span><button class="s" onclick="undoSpend('${r.ref_id}')">برگرداندن</button></div>`).join('') || '<div class="m" style="margin-top:8px">هنوز خرجی ثبت نشده.</div>'}</div>`;
    return `${spendCard}<div class="card"><div class="big">${fa(bal)}</div><div class="m">این هفته: +${fa(week)}</div>
      <div class="row"><input id="md" type="number" placeholder="+۵ یا −۳"><input id="mn" placeholder="دلیل"><button onclick="manual()">ثبت</button></div>
      <button class="g" style="margin-top:8px" onclick="closeMonth()">بستن ماه و تبدیل به پول</button></div>
      <div class="card"><b>⚠ جریمه‌ی روزانه</b><div class="m">هر جریمه برای هر روز یک بار ثبت می‌شود. امتیاز از موجودی کم می‌شود.</div>
        ${(prules || []).map(p => `<div class="row" style="margin-top:8px"><span style="flex:1">${esc(p.title)} <span class="m">−${fa(p.points)}</span></span><button class="r" onclick="applyPenalty('${p.id}')">ثبت امروز</button><button class="s" onclick="delPenalty('${p.id}')">حذف</button></div>`).join('') || '<div class="m" style="margin-top:6px">هنوز جریمه‌ای تعریف نشده.</div>'}
        <div class="row" style="margin-top:8px"><input id="pt" placeholder="عنوان (مثلاً بی‌ادبی)"><input id="pp" type="number" placeholder="امتیاز"><button onclick="addPenalty()">افزودن</button></div></div>

const lastNDays = n => { const out = [], base = new Date(today() + 'T12:00:00Z'); for (let i = n - 1; i >= 0; i--) { const x = new Date(base); x.setUTCDate(base.getUTCDate() - i); out.push(x.toISOString().slice(0, 10)); } return out; };
const fmtMin = m => { const h = Math.floor(m / 60), r = m % 60; return h ? `${fa(h)} ساعت${r ? ' و ' + fa(r) + ' دقیقه' : ''}` : `${fa(r)} دقیقه`; };
const val = id => $('#' + id).value.trim();
async function addKid() { const n = prompt('نام فرزند؟'); if (n) { await sb.from('kids').insert({ name: n }); boot(); } }
const DAYS_FA = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه', 'شنبه'];
const faStr = x => String(x).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
function taskWhen(t) {
  const s = t.schedule || {};
  if (!s.type) return t.kind === 'daily' ? 'هر روز' : t.kind === 'weekly' ? (t.weekdays || []).map(i => DAYS_FA[i]).join('، ') : 'یک‌بار';
  if (s.type === 'daily') return 'هر روز';
  if (s.type === 'weekdays') return (s.weekdays || []).map(i => DAYS_FA[i]).join('، ');
  if (s.type === 'monthly') return `روز ${faStr(s.month_day)} هر ماه`;
  if (s.type === 'interval') return `هر ${faStr(s.every_n)} روز`;
  if (s.type === 'once') return `یک‌بار در ${faStr(s.date)}`;
  return '';
}
function setTaskType(k) {
  $('#tk').value = k;
  document.querySelectorAll('.tt-sec').forEach(el => el.style.display = 'none');
  const sec = document.getElementById('tw-' + k); if (sec) sec.style.display = 'block';
  document.querySelectorAll('.tt-btn').forEach(b => b.className = b.dataset.k === k ? 'tt-btn' : 'tt-btn s');
}
function toggleWd(i) {
  const cur = val('tweek').split(',').filter(Boolean);
  const x = String(i);
  const next = cur.includes(x) ? cur.filter(v => v !== x) : [...cur, x].sort();
  $('#tweek').value = next.join(',');
  document.querySelectorAll('.wd-btn').forEach(b => b.className = next.includes(b.dataset.i) ? 'wd-btn' : 'wd-btn s');
}
function editTask(id) { st.editTask = id; st.tab = 'tasks'; render(); }
function cancelEdit() { st.editTask = null; render(); }
async function saveTask() {
  const title = val('tt');
  if (!title) return alert('عنوان کار را بنویس.');
  const type = val('tk');
  const sched = { type };
  if (type === 'weekdays') { sched.weekdays = val('tweek').split(',').filter(Boolean).map(Number); if (!sched.weekdays.length) return alert('حداقل یک روز هفته را انتخاب کن.'); }
  if (type === 'monthly') { sched.month_day = +val('tmd'); if (!(sched.month_day >= 1 && sched.month_day <= 31)) return alert('روز ماه باید بین ۱ تا ۳۱ باشد.'); }
  if (type === 'interval') { sched.every_n = +val('tev'); if (!(sched.every_n >= 2)) return alert('عدد بزرگ‌تر از ۱ بنویس.'); }
  if (type === 'once') { sched.date = val('tdate'); if (!sched.date) return alert('تاریخ را انتخاب کن.'); }
  sched.start = val('tstart') || (type === 'interval' ? today() : null);
  sched.end = val('tend') || null;
  if (type === 'once') { sched.start = null; sched.end = null; }
  const kind = type === 'weekdays' ? 'weekly' : type === 'once' ? 'once' : 'daily';
  const row = { title, kind, schedule: sched, weekdays: type === 'weekdays' ? sched.weekdays : null,
    points: Math.max(0, +val('tp') || 0), penalty_points: Math.max(0, +val('tpen') || 0), due_time: val('ttime') || null,
    needs_photo: $('#tph').checked, active: true };
  const res = st.editTask ? await sb.from('tasks').update(row).eq('id', st.editTask) : await sb.from('tasks').insert({ ...row, kid_id: st.kid });
  if (res.error) return alert('ذخیره نشد: ' + res.error.message);
  st.editTask = null; render();
}
async function copyTask(id, toKid) {
  const { data: t } = await sb.from('tasks').select('*').eq('id', id).single();
  const { id: _a, created_at: _b, kid_id: _c, ...rest } = t;
  const { error } = await sb.from('tasks').insert({ ...rest, kid_id: toKid });
  if (error) return alert('کپی نشد: ' + error.message);
  alert('کپی شد ✓'); render();
}
async function copyAll(toKid) {
  const { data: ts } = await sb.from('tasks').select('*').eq('kid_id', st.kid).eq('active', true);
  if (!ts || !ts.length) return;
  const rows = ts.map(({ id, created_at, kid_id, ...rest }) => ({ ...rest, kid_id: toKid }));
  const { error } = await sb.from('tasks').insert(rows);
  if (error) return alert('کپی نشد: ' + error.message);
  alert(`${fa(rows.length)} کار کپی شد ✓`); render();
}
async function delTask(id) { await sb.from('tasks').update({ active: false }).eq('id', id); render(); }
async function approve(id) {
  const { data: l } = await sb.from('task_logs').select('*, tasks(points,title)').eq('id', id).single();
  if (l.status === 'approved') return;
  const pts = l.points_awarded ?? l.tasks.points;
  await sb.from('task_logs').update({ status: 'approved', points_awarded: pts }).eq('id', id);
  if (pts) await sb.from('points_ledger').insert({ kid_id: l.kid_id, delta: pts, reason: 'task', ref_id: id, note: l.tasks.title });
  render();
}
async function reject(id) {
  const { data: l } = await sb.from('task_logs').select('*, tasks(title)').eq('id', id).single();
  if (l.status === 'approved' && l.points_awarded) await sb.from('points_ledger').insert({ kid_id: l.kid_id, delta: -l.points_awarded, reason: 'penalty', ref_id: id, note: 'لغو: ' + l.tasks.title });
  await sb.from('task_logs').update({ status: 'rejected', points_awarded: null }).eq('id', id); render();
}
async function showPhoto(path) {

async function addPenalty() {

async function applyPenalty(id) {
  const { data: rule } = await sb.from('penalty_rules').select('*').eq('id', id).single();
  const { error } = await sb.from('penalty_logs').insert({ rule_id: id, kid_id: rule.kid_id, day: today(), points: rule.points });
  if (error) return alert(error.code === '23505' ? 'این جریمه برای امروز قبلاً ثبت شده.' : error.message);
  await sb.from('points_ledger').insert({ kid_id: rule.kid_id, delta: -rule.points, reason: 'penalty', note: 'جریمه: ' + rule.title });
  render();
}
async function delPenalty(id) { await sb.from('penalty_rules').update({ active: false }).eq('id', id); render(); }
async function manual() {
  const d = +val('md'); if (!d) return;
  await sb.from('points_ledger').insert({ kid_id: st.kid, delta: d, reason: d > 0 ? 'manual' : 'penalty', note: val('mn') || null });
  render();
}
async function undoSpend(ref) {
  if (!ref || ref === 'null' || !confirm('این خرج برگردانده شود؟ امتیازش (و هدیه‌ی سرمایه‌گذاری‌اش) به حالت قبل برمی‌گردد.')) return;
  await sb.from('points_ledger').delete().eq('ref_id', ref).in('reason', ['spend', 'invest_gift']);
  render();
}
async function closeMonth() {
  const bal = await balance(st.kid); if (bal <= 0) return alert('امتیازی نیست.');
  if (!confirm(`${bal} امتیاز = ${bal * st.rate} تومان. ماه بسته شود و امتیاز صفر شود؟`)) return;
  const month = today().slice(0, 7);
  const { error } = await sb.from('month_closings').insert({ kid_id: st.kid, month, points_earned: bal, toman_per_point: st.rate, spent_on: prompt('جایزه چی خریده شد؟') });
  if (error) return alert(error.message);
  await sb.from('points_ledger').insert({ kid_id: st.kid, delta: -bal, reason: 'payout', note: 'بستن ماه ' + month });
  render();
}
async function addWish() {
  if (!val('wt')) return;
  await sb.from('wishlist').insert({ kid_id: st.kid, title: val('wt'), source_url: val('wu') || null, image_url: val('wi') || null, price_toman: +val('wp') || null });
  render();
}
async function lookup() {
  const url = val('wu'), query = val('wt');
  if (!url && !query) return alert('نام یا لینک را بنویس.');
  $('#lk').textContent = 'در حال جست‌وجو…';
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(SB_URL + '/functions/v1/fetch-price', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token, apikey: SB_KEY }, body: JSON.stringify(url ? { url } : { query }) });
  const j = await r.json();
  if (!r.ok) { $('#lk').textContent = 'پیدا نشد: ' + (j.error || r.status); return; }
  if (j.title && !val('wt')) $('#wt').value = j.title;
  if (j.price_toman) $('#wp').value = j.price_toman;
  if (j.image_url) $('#wi').value = j.image_url;
  if (j.source_url && !val('wu')) $('#wu').value = j.source_url;
  $('#lk').textContent = j.price_toman ? 'قیمت پیدا شد؛ قبل از افزودن بررسی کن.' : 'قیمت مطمئن پیدا نشد؛ دستی وارد کن.';
}
async function bought(id) { await sb.from('wishlist').update({ status: 'bought' }).eq('id', id); render(); }
async function dropWish(id) { await sb.from('wishlist').update({ status: 'dropped' }).eq('id', id); render(); }
async function saveRate() { st.rate = +val('rt') || 1000; await sb.from('settings').update({ toman_per_point: st.rate }).eq('id', 1); alert('ذخیره شد'); }
async function saveReminder() {
  const q = val('rmq').trim();
  if (q && !/^(\d{1,2}-\d{1,2})(,\d{1,2}-\d{1,2})*$/.test(q)) return alert('به شکل 23-10,14-18 بنویس');
  await sb.from('kids').update({ reminder_on: !!$('#rmo')?.checked, reminder_quiet: q }).eq('id', st.kid);
  alert('ذخیره شد'); boot();
}
async function saveKid() {
  const u = { daily_limit_min: +val('dl') || 120, bonus_under_min: val('bu') ? +val('bu') : null, bonus_points: +val('bp') || 0, auto_penalty: !!$('#ap')?.checked };
  if (val('kp')) { if (!/^\d{4,8}$/.test(val('kp'))) return alert('رمز باید ۴ تا ۸ رقم باشد.'); u.pin_hash = await sha(val('kp')); }
  await sb.from('kids').update(u).eq('id', st.kid);
  boot();
}
async function addDict() {
  const phrases = $('#dx').value.split('\n').map(x => x.trim()).filter(Boolean);
  if (!phrases.length) return alert('حداقل یک جمله بنویس.');
  await sb.from('dictations').insert({ kid_id: st.kid, title: val('dt') || 'دیکته', phrases, points: +val('dp') || 10, status: 'ready', created_by: 'parent' });
  render();
}
async function saveDict(id) {
  const phrases = $('#ph_' + id).value.split('\n').map(x => x.trim()).filter(Boolean);
  if (!phrases.length) return alert('متن خالی است.');
  await sb.from('dictations').update({ phrases, status: 'ready' }).eq('id', id); render();
}
async function delDict(id) { if (confirm('حذف شود؟')) { await sb.from('dictations').delete().eq('id', id); render(); } }
async function approveDict(id) {
  const { data: d } = await sb.from('dictations').select('*').eq('id', id).single();
  if (d.status !== 'graded') return;
  const pts = d.points_awarded ?? d.points;
  await sb.from('dictations').update({ status: 'done', points_awarded: pts }).eq('id', id);
  if (pts) await sb.from('points_ledger').insert({ kid_id: d.kid_id, delta: pts, reason: 'task', ref_id: id, note: 'دیکته: ' + d.title });
  render();
}
async function rejectDict(id) {
  await sb.from('dictations').update({ status: 'ready', done_day: null, ai_score: null, ai_feedback: null, points_awarded: null, answer_photo_path: null }).eq('id', id); render();
}
async function saveDictSettings() {
  await sb.from('settings').update({ dictation_requires_review: $('#dr').checked, dictation_points: +val('dpt') || 10, dictation_daily_limit: +val('dlm') || 2 }).eq('id', 1);
  alert('ذخیره شد');
}
async function saveHosts() {
  const v = val('lh').toLowerCase().split(',').map(x => x.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '')).filter(Boolean).join(',');
  await sb.from('settings').update({ lesson_hosts: v }).eq('id', 1); alert('ذخیره شد'); render();
}
async function saveAuto() { await sb.from('settings').update({ auto_approve_score: val('aa') ? +val('aa') : null }).eq('id', 1); alert('ذخیره شد'); }
async function toggleApp(pkg, on) {
  if (on) await sb.from('app_rules').upsert({ kid_id: st.kid, package_name: pkg, locked: false }, { onConflict: 'kid_id,package_name' });
  else await sb.from('app_rules').delete().eq('kid_id', st.kid).eq('package_name', pkg);
  render();
}
async function ruleSet(id, patch) { await sb.from('app_rules').update(patch).eq('id', id); }
async function pairDevice() {
  const a = new Uint8Array(18); crypto.getRandomValues(a);
  const token = [...a].map(b => b.toString(36).padStart(2, '0')).join('').slice(0, 24).toUpperCase();
  const { error } = await sb.from('devices').insert({ token_hash: await sha(token) });
  if (error) return alert(error.message);
  prompt('این کد را فقط یک‌بار می‌بینی. در اپ گوشی بچه‌ها وارد کن:', token);
  render();
}
async function cmd(command, payload) {
  const { data: devs } = await sb.from('devices').select('id');
  if (!devs?.length) return alert('گوشی وصل نیست.');
  await sb.from('device_commands').insert(devs.map(d => ({ device_id: d.id, command, payload: payload || null })));
  alert('دستور فرستاده شد؛ حداکثر تا یک دقیقه‌ی دیگر روی گوشی اعمال می‌شود.');
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
